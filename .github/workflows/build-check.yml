name: Build and test

# Runs on every push and pull request:
#   1. compiles the application (non-hardware camera stub, UseSapera=false,
#      because the Sapera SDK is not installed on GitHub's build machines);
#   2. runs the automated tests in tests/ (no cameras, PLC or SQL needed).
# This proves the code compiles and the tested calculations hold; it does not
# replace a check on the production computer.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Two calibration-session files are git-ignored (they live only on the
      # development computer). Use CI stand-ins on the build machine only.
      - name: Provide git-ignored calibration-session files (build machine only)
        shell: pwsh
        run: |
          $pairs = @(
            @('tests/ci-stubs/CalibrationSessionState.cs.txt', 'src/OptimizationXY.Charger/Models/Calibration/CalibrationSessionState.cs'),
            @('tests/ci-stubs/CalibrationSessionStore.cs.txt', 'src/OptimizationXY.Charger/Services/Calibration/CalibrationSessionStore.cs')
          )
          foreach ($p in $pairs) { if (-not (Test-Path $p[1])) { Copy-Item $p[0] $p[1] } }

      # SkipLicx: the dotnet command line cannot embed licenses.licx (MSB4803).
      # Visual Studio / ClickOnce builds still embed it.
      - name: Build application (no Sapera)
        shell: pwsh
        run: |
          dotnet build src/OptimizationXY.Charger/OptimizationXY.Charger.csproj -c Release -p:UseSapera=false -p:SkipLicx=true -p:Platform=x64 -clp:NoSummary 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern ': error ' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          exit $code

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test tests/OptimizationXY.Charger.Tests/OptimizationXY.Charger.Tests.csproj -c Release -p:UseSapera=false -p:SkipLicx=true -p:Platform=x64 --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          Select-String -Path test.log -Pattern ': error |Failed |\[FAIL\]|Assert\.' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          Select-String -Path test.log -Pattern 'Passed!|Failed!|Total tests' | ForEach-Object { Write-Output "::notice title=Test summary::$($_.Line.Trim())" }
          exit $code
