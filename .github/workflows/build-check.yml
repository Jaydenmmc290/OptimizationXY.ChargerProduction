name: Build check

# Compile check for every push and pull request.
# Builds with the non-hardware camera stub (UseSapera=false) because the
# Sapera SDK is not installed on GitHub's build machines. This proves the
# code compiles; it does not replace testing on the production computer.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # SkipLicx: the dotnet command line cannot embed licenses.licx (MSB4803).
      # Visual Studio / ClickOnce builds still embed it.
      - name: Build (no Sapera)
        shell: pwsh
        run: |
          dotnet build src/OptimizationXY.Charger/OptimizationXY.Charger.csproj -c Release -p:UseSapera=false -p:SkipLicx=true -p:Platform=x64 -clp:NoSummary 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern ': error ' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          exit $code
