name: Build check

# Compile check for every push and pull request.
# Builds with the non-hardware camera stub (UseSapera=false) because the
# Sapera SDK is not installed on GitHub's build machines. This proves the
# code compiles; it does not replace testing on the production computer.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The dotnet command line cannot embed licenses.licx (error MSB4803).
      # It is removed in this build machine's copy only, for the compile check.
      - name: Remove licenses.licx (build machine copy only)
        shell: pwsh
        run: Remove-Item src/OptimizationXY.Charger/licenses.licx

      - name: Build (no Sapera)
        run: dotnet build src/OptimizationXY.Charger/OptimizationXY.Charger.csproj -c Release -p:UseSapera=false -p:Platform=x64
